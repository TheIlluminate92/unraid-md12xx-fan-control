name: Bug report
description: Report a reproducible plugin problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include credentials, hostnames, network addresses, disk serial numbers, share names, or unredacted serial-adapter identifiers."
  - type: input
    id: versions
    attributes:
      label: Plugin and Unraid versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional redacted diagnostics archive
      description: Use Export local diagnostics, inspect the archive, then drag the ZIP into this box or use GitHub's attachment button. Attachments to this public repository are public.
      placeholder: Drag a reviewed .zip, .gz, or .tar.gz archive here, or leave this field empty.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed every attached file and understand that attachments to this public repository can be accessed without authentication.
          required: true
